<!DOCTYPE html>
<html lang='fr'>
<head>
	<meta charset='utf-8'>
	<meta name='viewport' content='width=device-width, initial-scale=1'>
	<title>Exercice 1</title>
</head>
<body>
	<h1>Exercice 1</h1>
	<p id="loading">Chargement...</p>
	
	<script>
		if ('geolocation' in navigator) {
			var options = {
			  enableHighAccuracy: true,
			};

			function success(pos) {
			  var crd = pos.coords;

			  document.getElementById('loading').remove();
			  
			  var table = document.createElement('table');
			  
			  var header = table.createTHead();
			  var headerRow = header.insertRow(0);
			  headerRow.insertCell(0).innerHTML = "<b>Propriété</b>";
			  headerRow.insertCell(1).innerHTML = "<b>Valeur</b>";

			  var tbody = table.createTBody();

			  function ajouterLigne(propriete, valeur) {
				  var row = tbody.insertRow();
				  row.insertCell(0).innerHTML = "<b>" + propriete + "</b>";	
				  row.insertCell(1).innerHTML = valeur !== null ? valeur : "Non disponible";
			  }

			  ajouterLigne("Latitude", crd.latitude);
			  ajouterLigne("Longitude", crd.longitude);
			  ajouterLigne("Précision", crd.accuracy + " mètres");
			  ajouterLigne("Altitude", crd.altitude);
			  ajouterLigne("Vitesse", crd.speed);
			  ajouterLigne("Date", new Date(pos.timestamp).toLocaleString());

			  document.body.appendChild(table);
			}

			function error(err) {
			  var loadingElement = document.getElementById('loading');
			  if(loadingElement) loadingElement.innerText = `ERREUR : ${err.message}`;
			  console.warn(`ERREUR (${err.code}): ${err.message}`);
			}

			navigator.geolocation.getCurrentPosition(success, error, options);
		} else {
			alert('Géolocalisation non supportée!');
		}
	</script>
</body>
</html>
