<!DOCTYPE html>
<html lang='fr'>
<head>
	<meta charset='utf-8'>
	<meta name='viewport' content='width=device-width, initial-scale=1'>
	<title>TD1 - Exercice 2</title>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
	<div id="map" style="height: 100vh;"></div>
	<div id="infoPanel" style="position: absolute; z-index: 1000; top: 10px; right: 10px; background: white; padding: 8px 12px; border-radius: 4px; font-family: sans-serif; font-size: 14px; box-shadow: 0 1px 5px rgba(0,0,0,0.4);">
		Distance à Marseille : en attente de la position...
	</div>
	<script>
		var map = L.map('map').setView([51.505, -0.09], 13);

		L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_terrain/{z}/{x}/{y}{r}.png?api_key=eed6a6b4-d171-43e4-8215-e5f8490b4245', {
			minZoom: 1,
			maxZoom: 18,
			attribution: '&copy; <a href="https://stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://stamen.com/" target="_blank">Stamen Design</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
		}).addTo(map);

		L.marker([43.7,  7.25]).addTo(map)
			.bindPopup('Nice, France')

		L.polygon([
		    [32.294, -64.783],
		    [25.761, -80.191],
		    [18.465, -66.105]
		], {
		    color: 'red',
		    fillColor: '#f03',
		    fillOpacity: 0.3
		}).addTo(map).bindPopup('Le Triangle des Bermudes');

		var dotIcon = L.divIcon({
		    className: 'custom-dot-marker',
		    html: `<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
		            <circle cx="12" cy="12" r="10" fill="#007bff" />
		            <circle cx="12" cy="12" r="7" fill="white" />
		            <circle cx="12" cy="12" r="4" fill="#007bff" />
		           </svg>`,
		    iconSize: [24, 24],
		    iconAnchor: [12, 12]
		});

		var marker = L.marker()
			.bindPopup('Vous êtes ici !')
			.setIcon(dotIcon);

		var first = true;

		var precisioncircle = L.circle([0, 0], {
			color: 'blue',
			fillColor: '#007bff',
			fillOpacity: 0.2,
			radius: 0
		});

		var marseillepos;

		L.polyline([[43.29695, 5.36978], [43.7,  7.25]], {color: 'green', weight: 4, opacity: 0.7}).addTo(map);

		var marseillemarker = L.marker([43.29695, 5.36978]).addTo(map)
			.bindPopup('Marseille, France');

		// Données GeoJSON : contour de la commune de Nice (source: geo.api.gouv.fr)
		fetch('https://geo.api.gouv.fr/communes/06088?format=geojson&geometry=contour')
			.then(res => res.json())
			.then(data => {
				L.geoJSON(data, {
					style: { color: 'purple', weight: 2, fillOpacity: 0.05 }
				}).addTo(map).bindPopup('Contour de la commune de Nice (GeoJSON, geo.api.gouv.fr)');
			})
			.catch(err => console.warn('Erreur chargement GeoJSON Nice :', err));

		// Trajet routier Marseille -> Nice via OSRM
		fetch('https://router.project-osrm.org/route/v1/driving/5.36978,43.29695;7.25,43.7?overview=full&geometries=geojson')
			.then(res => res.json())
			.then(data => {
				var route = data.routes[0];
				var routeLine = L.geoJSON(route.geometry, {
					style: { color: 'orange', weight: 4, dashArray: '6 6' }
				}).addTo(map);
				var km = (route.distance / 1000).toFixed(1);
				var mn = (route.duration / 60).toFixed(0);
				routeLine.bindPopup(`Trajet routier Marseille → Nice (OSRM)<br>${km} km, ${mn} min`);
			})
			.catch(err => console.warn('Erreur chargement itinéraire OSRM :', err));

		function successWatch(pos) {
			var crd = pos.coords;

			marker.setLatLng([crd.latitude, crd.longitude]).addTo(map);
			if (first) {
				map.setView([crd.latitude, crd.longitude], 25);
				first = false;
			}
			precisioncircle.setLatLng([crd.latitude, crd.longitude]).setRadius(crd.accuracy).addTo(map);

			marseillepos = map.distance([crd.latitude, crd.longitude], [43.29695, 5.36978]);
			var distanceTxt = `Distance à Marseille : ${(marseillepos / 1000).toFixed(2)} km`;
			console.log(distanceTxt);
			document.getElementById('infoPanel').textContent = distanceTxt;
			marker.bindPopup(`Vous êtes ici !<br>${distanceTxt}`);
		}

		function errorWatch(err) {
		  console.warn(`ERREUR (${err.code}): ${err.message}`);
		}

		navigator.geolocation.watchPosition(successWatch, errorWatch);
	</script>
</body>
</html>
