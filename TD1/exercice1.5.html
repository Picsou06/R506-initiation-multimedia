<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<title>Exercice 1.5 Orientation</title>
	<style>
		body { 
			margin: 0; 
			overflow: hidden; 
			background: linear-gradient(135deg, #edf5ff 0%, #e4f0ff 100%);
			color: #123;
			font-family: sans-serif;
		}
		#ui-container {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			text-align: center;
			z-index: 10;
			background: rgba(255,255,255,0.72);
			padding: 25px 30px;
			border-radius: 16px;
			box-shadow: 0 10px 30px rgba(21, 74, 130, 0.12);
		}
		button {
			padding: 15px 25px;
			font-size: 18px;
			background: linear-gradient(135deg, #2b7fff, #0a4fc6);
			color: white;
			border: none;
			border-radius: 10px;
			cursor: pointer;
			box-shadow: 0 8px 18px rgba(0, 88, 214, 0.22);
		}
		canvas {
			display: block;
			filter: brightness(0.9) saturate(0.9);
		}
	</style>
	<script type="importmap">
		{
			"imports": {
				"three": "https://unpkg.com/three@0.160.0/build/three.module.js"
			}
		}
	</script>
</head>
<body>

	<div id="ui-container">
		<h2>Détection de mouvement</h2>
		<button id="btn-start">Autoriser l'accès aux capteurs</button>
	</div>

	<script type="module">
		import * as THREE from 'three';

		const scene = new THREE.Scene();
		const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
		const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
		renderer.setClearColor(0xeef5ff, 1);
		renderer.setSize(window.innerWidth, window.innerHeight);
		document.body.appendChild(renderer.domElement);

		const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
		scene.add(ambientLight);
		const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
		directionalLight.position.set(5, 10, 7);
		scene.add(directionalLight);

		const phoneGroup = new THREE.Group();
		scene.add(phoneGroup);

		const bodyGeometry = new THREE.BoxGeometry(1.5, 3, 0.15);
		const bodyMaterials = [
			new THREE.MeshStandardMaterial({ color: 0x0d0d0d, metalness: 0.8, roughness: 0.5 }),
			new THREE.MeshStandardMaterial({ color: 0x0d0d0d, metalness: 0.8, roughness: 0.5 }),
			new THREE.MeshStandardMaterial({ color: 0x0d0d0d, metalness: 0.8, roughness: 0.5 }),
			new THREE.MeshStandardMaterial({ color: 0x0d0d0d, metalness: 0.8, roughness: 0.5 }),
			new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.5, roughness: 0.6 }),
			new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.5, roughness: 0.6 })
		];
		const phone = new THREE.Mesh(bodyGeometry, bodyMaterials);
		phoneGroup.add(phone);

		const screenGeometry = new THREE.PlaneGeometry(1.05, 1.75);
		const screenMaterial = new THREE.MeshStandardMaterial({
			color: 0x0b1320,
			emissive: 0x183b74,
			emissiveIntensity: 0.4,
			metalness: 0.2,
			roughness: 0.5
		});
		const screen = new THREE.Mesh(screenGeometry, screenMaterial);
		screen.position.set(0, 0, 0.09);
		phoneGroup.add(screen);

		phoneGroup.visible = false;
		camera.position.z = 5;

		function handleOrientation(event) {
			const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
			const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
			const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;

			phone.rotation.x = beta;
			phone.rotation.y = gamma;
			phone.rotation.z = -alpha;
		}

		const btnStart = document.getElementById('btn-start');
		const uiContainer = document.getElementById('ui-container');

		btnStart.addEventListener('click', () => {
			if (typeof DeviceOrientationEvent.requestPermission === 'function') {
				DeviceOrientationEvent.requestPermission()
					.then(permissionState => {
						if (permissionState === 'granted') {
							window.addEventListener('deviceorientation', handleOrientation);
							uiContainer.style.display = 'none';
						} else {
							alert("Permission refusée.");
						}
					})
					.catch(console.error);
			} else {
				window.addEventListener('deviceorientation', handleOrientation);
				uiContainer.style.display = 'none';
			}
		});

		function animate() {
			requestAnimationFrame(animate);
			renderer.render(scene, camera);
		}
		animate();

		window.addEventListener('resize', () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		});
	</script>
</body>
</html>
